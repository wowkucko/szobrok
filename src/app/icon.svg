<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#52525b"/>
      <stop offset="1" stop-color="#27272a"/>
    </linearGradient>
  </defs>
  <!-- Sötét, lekerekített alaplap (a weboldal stílusához) -->
  <rect width="64" height="64" rx="14" fill="#18181b"/>
  <!-- Ecset: nyél + fémgyűrű + borostyán sörték, átlósan (alulról balra → jobbra fel) -->
  <g transform="rotate(-45 32 32)">
    <rect x="9" y="27" width="27" height="10" rx="5" fill="url(#handle)"/>
    <rect x="36" y="25" width="5" height="14" rx="1.5" fill="#a1a1aa"/>
    <path d="M41 26 L57 19.5 Q61.5 32 57 44.5 L41 38 Q43.5 32 41 26 Z" fill="url(#amber)"/>
  </g>
  <!-- Festékcsepp a sörték hegyénél -->
  <path d="M50 3 Q55.5 9.5 50 14.5 Q44.5 9.5 50 3 Z" fill="#f59e0b"/>
</svg>
